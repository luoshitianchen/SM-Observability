[project]
name = "SM-Observability"
version = "2.0.0"
description = "企业监控运维平台：健康探测、SLO、告警与延迟/错误率"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
